[project]
name = "smile-diffusion"
version = "0.1.0"
description = "Face-to-smile transfer via InstructPix2Pix + LoRA"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "diffusers==0.27.2",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "omegaconf>=2.3.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
lpips = ["lpips>=0.1.4"]
xformers = ["xformers>=0.0.26"]
eval = ["clean-fid>=0.1.35", "lpips>=0.1.4"]
dev = ["ipykernel", "jupyter"]

[project.scripts]
build-pairs = "data.build_pairs:main"
train = "scripts.train:main_cli"
infer = "scripts.infer:main"

[tool.uv]
# RTX 5080 は CUDA 12.8 ビルドが必要
index-url = "https://download.pytorch.org/whl/cu128"
extra-index-url = ["https://pypi.org/simple"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "scripts"]