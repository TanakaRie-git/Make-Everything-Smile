[project]
name = "smile-gan"
version = "0.1.0"
description = "StarGAN-style smile transfer onto plain objects (Make-Everything-Smile, GAN track)"
requires-python = ">=3.12, <3.13"
dependencies = [
    "torch>=2.6,<2.11",
    "torchvision>=0.21,<0.26",
    "numpy>=2.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.30",
    "datasets>=3.0",
    "pyyaml>=6.0",
    "nltk>=3.9.4",
    "torchmetrics>=1.9.0",
    "lpips>=0.1.4",
    "open-clip-torch>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smilegan"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.uv]
environments = ["sys_platform == 'linux'"]
